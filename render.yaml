# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# 배포 방법: Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
#   1) 이 파일을 읽어 웹 서비스 1개를 만든다. (main 브랜치, push 시 자동 재배포)
#   2) sync: false 로 표시된 AI_API_KEY 는 Apply 단계에서 직접 입력한다. (저장소에 두지 않는다)
#   3) SECRET_KEY 와 ADMIN_PASSWORD 는 Render 가 임의 값으로 생성한다.
#      ADMIN_PASSWORD(관리자 페이지 /admin 의 비밀번호)는 대시보드의 Environment 탭에서 확인한다.
#
# 주의: 무료 플랜은 15분 미사용으로 잠들거나 재시작·재배포될 때마다 디스크가 초기화되어 SQLite(app.db) 데이터가 사라진다.
#       무료 플랜에는 Persistent Disk 를 붙일 수 없다. 데이터를 유지하려면 유료 플랜의 디스크나 PostgreSQL 로 DATABASE_URL 을 바꾼다.
services:
  - type: web
    name: codyssey-ai-chatbot
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    # --loop asyncio: 첫 배포가 "앱은 기동했지만 상태 확인(/health)이 15분간 통과하지 못해" 취소된 적이 있다.
    # 원인은 확인하지 못했다. 리눅스에서만 쓰이는 uvloop 라는 변수를 없애려고 표준 asyncio 루프로 고정해 두었다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --loop asyncio
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11          # 로컬 개발·테스트와 같은 버전
      - key: SECRET_KEY
        generateValue: true     # 세션 쿠키 서명 키. Render 가 생성
      - key: ADMIN_PASSWORD
        generateValue: true     # 관리자 페이지(/admin) 비밀번호. Render 가 생성 (사용자명은 admin)
      - key: AI_API_KEY
        sync: false             # 배포 시 대시보드에서 입력
      - key: AI_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: AI_MODEL
        value: gpt-5.4
      - key: AI_TIMEOUT_SECONDS
        value: "20"
      - key: SESSION_COOKIE_SECURE
        value: "true"           # Render 는 HTTPS 로 서비스하므로 Secure 쿠키 사용
      - key: DATABASE_URL
        value: sqlite:///./app.db
