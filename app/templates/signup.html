{% extends "base.html" %}
{% block title %}회원가입 - Codyssey AI 챗봇{% endblock %}

{% block content %}
<section class="card">
  <h1>회원가입</h1>
  <form data-api="/api/auth/signup" data-next="/login?signup=1" novalidate>
    <p class="form-error" role="alert"></p>

    <div class="field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" autocomplete="username"
             required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autofocus>
      <small>영문, 숫자, 밑줄(_)만 사용해 3~30자</small>
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="new-password"
             required minlength="8" maxlength="128">
      <small>8~128자</small>
    </div>

    <div class="field">
      <label for="password_confirm">비밀번호 확인</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
    </div>

    <button class="button" type="submit">가입하기</button>
  </form>
  <p class="hint">이미 계정이 있나요? <a href="/login">로그인</a></p>
</section>
{% endblock %}

{% block scripts %}<script src="/static/auth.js"></script>{% endblock %}
